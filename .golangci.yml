version: "2"
linters:
  default: standard
  enable:
    - depguard
    - ginkgolinter
    - nilerr
  disable:
    # TODO: Enable these linters after fixing the existing issues.
    - errcheck
    - modernize
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    depguard:
      rules:
        restricted-packages:
          files:
            - $all
          deny:
            # depguard matches packages by prefix. A trailing "$" means an exact match.
            - pkg: html/template$
              desc: stdlib html/template must not be used
            - pkg: log$
              desc: log must not be used. Use log/slog instead.
    errcheck:
      exclude-functions:
        - github.com/cybozu-go/log.Info
        - github.com/cybozu-go/log.Warn
        - github.com/cybozu-go/log.Error
        - github.com/cybozu-go/log.Debug
        - github.com/cybozu-go/log.Critical
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
  settings:
    goimports:
      local-prefixes:
        - github.com/cybozu-go/setup-hw
