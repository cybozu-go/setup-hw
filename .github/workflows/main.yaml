name: main
on:
  pull_request:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  id-token: write # Takumi Guard (OIDC)
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04 # Use the version of Ubuntu supported by Dell iDRAC Tools.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@1c8aa7498f7f635fbd6ad6a0f436d03092b3502d # v1.1.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}

      - name: Install test tools
        run: make setup

      - name: Check auto-generated files
        run: make check-generated

      - name: Run test
        run: make test

      - name: Download iDRAC Tools
        run: make download-idractools

      - name: Build binaries
        run: make install GOBIN=`pwd`/docker

      - name: Build setup-hw image
        run: |
          docker build -t ghcr.io/cybozu-go/setup-hw:latest --target stage1 docker
          docker build -t ghcr.io/cybozu-go/setup-hw-secret:latest docker
