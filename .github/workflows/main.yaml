name: main
on:
  pull_request:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  id-token: write # Takumi Guard (OIDC)
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04 # Use the version of Ubuntu supported by Dell iDRAC Tools.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - name: Setup aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.66.0

      - name: Check auto-generated files
        run: make check-generated

      - name: Run lint
        run: make lint

      - name: Run test
        run: make test

      - name: Download iDRAC Tools
        run: make download-idractools

      - name: Build binaries
        run: make build

      - name: Build setup-hw image
        run: |
          docker build -t ghcr.io/cybozu-go/setup-hw:latest --target stage1 docker
          docker build -t ghcr.io/cybozu-go/setup-hw-secret:latest docker
